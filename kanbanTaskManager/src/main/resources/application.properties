spring.application.name=kanbanTaskManager

# Dynamic port assigned by cloud host (defaults to 8080 locally)
server.port=${PORT:8080}

# Database Connection (Pulls Render environment variables, falls back to local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/task_manager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update

# Custom JWT Properties (Cleaned: no quotes, no semicolons)
jwt.secret=${JWT_SECRET:1N8JW4yehXG6QnjQ9GX97X7TywK8jH1Dre/oiprSKgNGvg9eio0Z4krfFXGZTIxb}
jwt.expiration=864000000