spring.application.name=kanbanTaskManager

# Dynamic port assigned by cloud host (defaults to 8080 locally)
server.port=${PORT:8080}

# Database Connection (Pulls Render environment variables, falls back to local)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Custom JWT Properties (Cleaned: no quotes, no semicolons)
jwt.secret=${SECRET}
jwt.expiration=${JWT_EXPIRATION}
